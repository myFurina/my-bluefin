name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# ====== 👇 核心修改：增加 BUILDX_NO_DEFAULT_ATTESTATIONS: "1" 👇 ======
env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"  # 禁用 Buildx 附带的空证明层，完美兼容阿里云 ACR
  ACR_REGISTRY: crpi-hyhirhi1wnbbg62m.cn-chengdu.personal.cr.aliyuncs.com
  ACR_NAMESPACE: my_bluefin

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

          # 引用顶部环境变量与 Secrets 密码
          registry: ${{ env.ACR_REGISTRY }}
          registry_namespace: ${{ env.ACR_NAMESPACE }}
          registry_username: ${{ secrets.ACR_USERNAME }}
          registry_token: ${{ secrets.ACR_PASSWORD }}
