# 自动校准 /var 虚拟化运行目录权限与 SELinux 上下文标签
d /var/lib/libvirt 0755 root root -
d /var/log/libvirt 0755 root root -
d /var/cache/libvirt 0755 root root -
z /var/lib/libvirt 0755 root root -
z /var/log/libvirt 0755 root root -
z /var/cache/libvirt 0755 root root -

# 确保默认虚拟网络 (virbr0 / 192.168.122.x) 模板就位与开机自启
d /etc/libvirt/qemu/networks 0700 root root -
C /etc/libvirt/qemu/networks/default.xml 0600 root root - /usr/share/libvirt/networks/default.xml
d /etc/libvirt/qemu/networks/autostart 0700 root root -
L+ /etc/libvirt/qemu/networks/autostart/default.xml - - - - /etc/libvirt/qemu/networks/default.xml
