# 自动校准 /var 虚拟化运行目录权限与 SELinux 上下文标签
z /var/lib/libvirt 0755 root root -
z /var/log/libvirt 0755 root root -
z /var/cache/libvirt 0755 root root -

# 确保默认虚拟网络 (virbr0 / 192.168.122.x) 开机自启软链接存在
d /etc/libvirt/qemu/networks/autostart 0755 root root -
L+ /etc/libvirt/qemu/networks/autostart/default.xml - - - - /etc/libvirt/qemu/networks/default.xml
