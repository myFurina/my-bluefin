[Unit]
# 清除旧版的一刀切单次锁条件，允许服务在开机时通过增量管理器做毫秒级差分检测
ConditionPathExists=
# 严格保证在系统级 flatpak-preinstall 和镜像优化之后执行，杜绝写事务锁冲突与并发竞争
After=flatpak-preinstall.service flatpak-ustc-mirror.service
Wants=flatpak-ustc-mirror.service

[Service]
# 清空默认全量覆盖命令，转由自愈增量管理器接管（增量安装新应用，坚决不复活用户已删应用）
ExecStart=
ExecStart=/usr/libexec/my-bluefin/system-flatpak-incremental-setup
