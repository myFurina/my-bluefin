# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: my-bluefin
description: 个人的全自动 Bluefin 纯净系统（Nvidia + 原生 Chrome/VS Code/WezTerm/Clash/OpenCode + 单雾凇常驻 + 纯国内源初始化）

base-image: ghcr.io/ublue-os/bluefin-nvidia-open
image-version: stable

modules:
  # 1. 原生系统级软件包安装与清理（DNF）
  - type: dnf
    repos:
      files:
        - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
        - https://packages.microsoft.com/yumrepos/vscode/config.repo  # 微软 VS Code 官方源
      copr:
        - atim/starship                # 现代终端提示符 Starship
        - wezfurlong/wezterm-nightly   # WezTerm 每日构建源
        - lizardbyte/beta              # LizardByte Sunshine 官方原生 RPM 源
        - zeno/scrcpy                  # scrcpy 官方在 Fedora 推荐的 COPR 源
    install:
      packages:
        - micro                        # 现代易用终端编辑器 Micro
        - starship                     # 终端提示符 Starship
        - https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm # 原生 Google Chrome（供 Antigravity 浏览器技能直接调用）
        - code                         # 原生 VS Code
        - cloudflare-warp              # Cloudflare WARP 客户端
        - wezterm                      # WezTerm Nightly
        - sunshine                     # 原生 Sunshine 游戏串流服务端 (支持 KMS 硬件零拷贝)
        - scrcpy                       # 原生安卓低延迟投屏与控制 (支持硬件加速与音频转发)
        - android-tools                # 提供 adb 与 fastboot 核心命令行
        - android-udev-rules           # 免 root 自动识别各品牌安卓设备 USB 调试权限
        - google-droid-sans-fonts      # 提供 LocalSend 必需的 DroidSansFallbackFull.ttf
        - fcitx5
        - fcitx5-chinese-addons        # 中文拼音、双拼、云拼音支持
        - fcitx5-rime                  # Rime 输入法引擎
        - librime-lua                  # Rime Lua 插件（激活雾凇拼音 rq/sj 动态日期时间脚本）
        - fcitx5-gtk                   # GTK 模块支持
        - fcitx5-qt                    # Qt5 模块支持
        - fcitx5-qt6                   # Qt6 模块支持
        - fcitx5-configtool            # 图形化配置面板
        - virt-manager                          # 原生虚拟机图形管理器（无沙盒限制）
        - qemu-kvm                              # QEMU/KVM 硬件虚拟化核心模拟器
        - libvirt-daemon-kvm                    # 原生 KVM 虚拟化核心守护进程
        - libvirt-daemon-config-network         # 提供开箱即用的 default NAT 虚拟网络 (virbr0)
        - libvirt-client                        # virsh 等客户端管理工具
        - virtiofsd                             # 原生 Virtio-FS 共享内存守护进程（内存级极速共享）
        - edk2-ovmf                             # 原生 UEFI OVMF 固件
    remove:
      packages:
        - firefox                      # 移除原生火狐（改用自带全套解码器的 Flatpak 沙盒版）
        - firefox-langpacks

  # 2. 注入系统级静态配置文件（从 files/system/ 直接映射至镜像根目录 /）
  # 包含：WezTerm 配置、Brewfile、单雾凇常驻 Profile、Systemd 服务与预设、Polkit 规则、Flatpak 覆盖及首登钩子
  - type: files
    files:
      - source: system
        destination: /

  # 3. 声明式智能 GNOME 扩展模块（上游精准匹配 + 缺失版本自动兜底与 metadata 兼容性补丁）
  - type: smart-gnome-extensions
    source: local
    install:
      - kimpanel@kde.org

  # 4. 上游独立应用声明式原子模块
  - type: clash-verge
    source: local

  - type: opencode
    source: local

  - type: rime-ice
    source: local

  - type: antigravity
    source: local

  - type: vscode-extensions
    source: local
    install:
      # 界面汉化与项目管理
      - ms-ceintl.vscode-language-pack-zh-hans
      - alefragnani.project-manager

      # C/C++ 全套核心开发套件
      - ms-vscode.cpptools-extension-pack
      - ms-vscode.cpptools
      - ms-vscode.cmake-tools
      - ms-vscode.cpp-devtools
      - ms-vscode.cpptools-themes

      # Python 全套现代开发套件
      - ms-python.python
      - ms-python.vscode-pylance
      - ms-python.debugpy
      - ms-python.vscode-python-envs

  # 5. 系统底层规范化与收尾脚本
  - type: script
    scripts:
      - finalize-system.sh

  # 6. 系统级 Flatpak 软件套件（Fastly 官方源保证元数据完整 + 中科大 contenturl 镜像加速大包）
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo-name: flathub
        repo-url: https://dl.flathub.org/repo/
        install:
          # --- 核心网络与办公套件 ---
          - org.mozilla.firefox                     # 火狐浏览器（含全套非自由多媒体解码器）
          - org.mozilla.thunderbird_esr             # Thunderbird ESR 官方长期支持版邮件客户端
          - org.onlyoffice.desktopeditors           # ONLYOFFICE 现代办公套件
          - org.localsend.localsend_app             # LocalSend 局域网跨设备极速快传
          - com.github.marktext.marktext            # MarkText 现代 Markdown 所见即所得编辑器
          - io.podman_desktop.PodmanDesktop         # Podman 容器桌面管理工具

          # --- 系统日常实用工具 ---
          - org.gnome.Calendar                      # GNOME 日历
          - org.gnome.clocks                        # GNOME 时钟（闹钟、世界时钟、秒表）
          - org.gnome.Weather                       # GNOME 天气
          - org.gnome.Calculator                    # GNOME 桌面计算器
          - org.gnome.TextEditor                    # GNOME 轻量文本编辑器
          - org.gnome.FileRoller                    # 归档管理器（图形化解压 zip/7z/tar/rar）
          - org.gnome.baobab                        # 磁盘空间分析器 (Baobab)
          - org.gnome.font-viewer                   # 字体查看器
          - org.gnome.Logs                          # 系统运行与崩溃日志查看器
          - org.gnome.Characters                    # 特殊字符与符号查看器
          - org.gnome.Snapshot                      # 相机与快照
          - org.gnome.SimpleScan                    # 扫描易（文档与图像扫描）
          - org.gnome.Connections                   # 远程桌面连接器 (RDP/VNC)
          - org.gnome.Contacts                      # 联系人管理
          - org.gnome.Maps                          # 地图
          - org.gnome.DejaDup                       # Déjà Dup 备份工具
          - org.gnome.Firmware                      # 固件更新与检测 (fwupd)
          - org.gnome.NautilusPreviewer             # Sushi 空格快速文件预览插件

          # --- 多媒体查看与播放 ---
          - org.gnome.Loupe                         # 现代图片查看器 Loupe
          - org.gnome.Papers                        # 现代 PDF 文档阅读器 Papers
          - io.github.celluloid_player.Celluloid    # Celluloid (MPV 内核) 全能硬件加速播放器
          - org.gnome.Decibels                      # GNOME 极简音频播放器
          - cn.xfangfang.wiliwili                   # wiliwili (第三方 Bilibili 桌面/大屏客户端)
          - io.github.Predidit.Kazumi               # Kazumi (基于自定义规则的番剧采集与弹幕播放器)

          # --- Bluefin 社区精选增强工具 ---
          - com.mattjakeman.ExtensionManager        # GNOME 扩展管理器（在线搜索与开关扩展）
          - io.missioncenter.MissionCenter          # 任务中心 (Mission Center) 系统与 GPU 监控
          - com.github.tchx84.Flatseal              # Flatseal 容器沙盒权限管理器
          - io.github.flattool.Warehouse            # Warehouse Flatpak 包与运行时管理器
          - io.gitlab.adhami3310.Impression         # Impression 启动盘制作镜像写入工具
          - be.alexandervanhee.gradia               # Gradia 截图批注与编辑工具
          - com.github.PintaProject.Pinta           # Pinta 绘图与简易修图软件
          - it.mijorus.smile                        # Smile Emoji 表情快捷选择面板
          - page.tesk.Refine                        # Refine 字体渲染与排版微调
          - io.github.flattool.Ignition             # Ignition 自启动与配置管理
          - com.ranfdev.DistroShelf                 # DistroShelf 容器分发与隔离管理
          # io.github.kolunmi.Bazaar 由系统 flatpak-preinstall 优先托管安装
          - org.gtk.Gtk3theme.adw-gtk3              # GTK3 Adwaita 现代主题兼容支持
          - org.gtk.Gtk3theme.adw-gtk3-dark         # GTK3 Adwaita 深色主题兼容支持

  # 7. 容器镜像加密数字签名（必选）
  - type: signing
