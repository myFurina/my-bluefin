# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: my-bluefin
description: 个人的全自动 Bluefin 纯净系统（Nvidia + VS Code + WezTerm + Boxes + LocalSend 字体 + 现代输入法）

# 1. 硬件底座：
# 说明：若换到 Intel/AMD 核显或纯 A 卡设备，请将此处改为 ghcr.io/ublue-os/bluefin
# 若换到 GTX 1060 等 Pascal 架构老卡，请改为 ghcr.io/ublue-os/bluefin-nvidia
# 当前：RTX 20/30/40 等新显卡推荐使用 nvidia-open（原生自带 Tailscale 核心组件）
base-image: ghcr.io/ublue-os/bluefin-nvidia-open
image-version: stable

modules:
  # 2. 原生系统级安装：VS Code、Cloudflare WARP、WezTerm Nightly、输入法核心（含 Qt6 与 Droid 字体）
  - type: dnf
    repos:
      files:
        - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
        - https://packages.microsoft.com/yumrepos/vscode/config.repo  # 微软 VS Code 官方源
      copr:
        - wezfurlong/wezterm-nightly   # WezTerm 每日构建源
    install:
      packages:
        - code                         # 原生 VS Code（自带官方原生图标、右键菜单与 URL 协议）
        - cloudflare-warp              # Cloudflare WARP 客户端
        - wezterm                      # WezTerm Nightly（自带官方图标）
        - google-droid-sans-fonts      # 【精准补全】提供 LocalSend 修复必需的 DroidSansFallbackFull.ttf
        - fcitx5
        - fcitx5-chinese-addons        # 必备：中文拼音、双拼、云拼音支持
        - fcitx5-rime                  # 必备：Rime 引擎
        - fcitx5-gtk                   # GTK 模块支持
        - fcitx5-qt                    # Qt5 模块支持
        - fcitx5-qt6                   # 【精准补全】Qt6 模块支持，确保现代 Qt6 应用输入无障碍
        - fcitx5-configtool            # 图形化配置面板

  # 3. 注入标准桌面安全策略（Polkit 规则）：放入 /usr/share 符合 ostree 最佳规范
  - type: script
    snippets:
      - |
        echo "==> 正在配置 WARP 服务的桌面 Polkit 安全提权策略..."
        mkdir -p /usr/share/polkit-1/rules.d
        cat << 'EOF' > /usr/share/polkit-1/rules.d/50-warp-service.rules
        polkit.addRule(function(action, subject) {
            if (action.id == "org.freedesktop.systemd1.manage-units") {
                if (subject.isInGroup("wheel")) {
                    var unit = action.lookup("unit");
                    if (unit == "warp-svc.service") {
                        return polkit.Result.YES;
                    }
                }
            }
        });
        EOF
        chmod 644 /usr/share/polkit-1/rules.d/50-warp-service.rules

  # 4. 系统级植入 Cloudflare WARP 一键启停桌面图标，并彻底禁用其开机自启动
  - type: script
    snippets:
      - |
        echo "==> 正在系统级植入 Cloudflare WARP 一键启动与退出桌面图标，并关闭开机自启..."
        mkdir -p /usr/share/applications

        # 1. 禁用 warp-svc 系统后台服务自启（注入 preset 与显式 disable）
        mkdir -p /usr/lib/systemd/system-preset
        echo "disable warp-svc.service" > /usr/lib/systemd/system-preset/50-warp.preset
        systemctl disable warp-svc.service 2>/dev/null || true

        # 2. 禁用桌面托盘/客户端登录自动唤醒
        rm -f /etc/xdg/autostart/*warp* /etc/xdg/autostart/*cloudflare*

        # 3. 启动图标（走 Polkit 授权，无需 sudo）
        cat << 'EOF' > /usr/share/applications/cf-start.desktop
        [Desktop Entry]
        Type=Application
        Name=启动 Cloudflare WARP
        Comment=一键启动 Cloudflare WARP 服务及客户端
        Exec=sh -c "systemctl start warp-svc; nohup warp-taskbar >/dev/null 2>&1 & notify-send 'Cloudflare WARP' '后台服务与客户端已启动'"
        Icon=zero-trust-orange
        Terminal=false
        Categories=Network;
        Keywords=warp;cloudflare;start;
        EOF

        # 4. 退出图标（改用 pkill 确保系统绝对自带，平滑关闭）
        cat << 'EOF' > /usr/share/applications/cf-quit.desktop
        [Desktop Entry]
        Type=Application
        Name=退出 Cloudflare WARP
        Comment=一键彻底关闭 Cloudflare WARP 客户端及后台服务
        Exec=sh -c "pkill -f warp-taskbar 2>/dev/null; pkill -f warp-desktop-svc 2>/dev/null; systemctl stop warp-svc; notify-send 'Cloudflare WARP' '已彻底退出并停止服务'"
        Icon=application-exit
        Terminal=false
        Categories=Network;
        Keywords=warp;cloudflare;stop;exit;quit;
        EOF

  # 5. 动态抓取 GitHub 最新版 Clash Verge 原生打入系统（加入异常边界校验断言）
  - type: script
    snippets:
      - |
        echo "==> 正在精准解析 GitHub 最新版 Clash Verge..."
        FINAL_URL=$(curl -sfSL -o /dev/null -w '%{url_effective}' https://github.com/clash-verge-rev/clash-verge-rev/releases/latest)
        TAG="${FINAL_URL##*/}"
        VER="${TAG#v}"

        if [ -z "${FINAL_URL}" ] || [ "${TAG}" = "latest" ] || [ -z "${VER}" ]; then
            echo "==> 错误: 无法解析 Clash Verge 最新发布版本，请检查网络或 GitHub 状态。"
            exit 1
        fi

        CLASH_RPM="https://github.com/clash-verge-rev/clash-verge-rev/releases/download/${TAG}/Clash.Verge-${VER}-1.x86_64.rpm"
        echo "==> 检测到最新版本 [${VER}]，开始通过 dnf 安装: ${CLASH_RPM}"
        dnf install -y "${CLASH_RPM}"
        dnf clean all

  # 6. 固化现代 Wayland 输入法方案（极简纯净版：内置雾凇拼音 + Kimpanel 官方扩展 + 专属 GTK 兼容）
  - type: script
    snippets:
      - |
        echo "==> 正在系统级配置 Fcitx5、雾凇拼音与 GNOME 响应通道..."

        # 1. 注入 Fcitx5 基础环境变量（仅配置 XMODIFIERS 与 QT_IM_MODULE）
        mkdir -p /etc/environment.d
        cat << 'EOF' > /etc/environment.d/99-input-method.conf
        XMODIFIERS=@im=fcitx
        QT_IM_MODULE=fcitx
        EOF

        # 2. 全局 systemd 用户服务：Fcitx5 进程守护
        mkdir -p /usr/lib/systemd/user/graphical-session.target.wants
        cat << 'EOF' > /usr/lib/systemd/user/fcitx5.service
        [Unit]
        Description=Fcitx5 Input Method Framework
        PartOf=graphical-session.target
        After=graphical-session.target

        [Service]
        Type=simple
        ExecStart=/usr/bin/fcitx5 --replace
        Restart=always
        RestartSec=2
        TimeoutStopSec=5

        [Install]
        WantedBy=graphical-session.target
        EOF
        ln -sf /usr/lib/systemd/user/fcitx5.service /usr/lib/systemd/user/graphical-session.target.wants/fcitx5.service

        # 3. GNOME 全局默认配置：静音 IBus 并设置 GNOME xsettings 对接 Fcitx
        mkdir -p /etc/dconf/profile
        cat << 'EOF' > /etc/dconf/profile/user
        user-db:user
        system-db:local
        EOF

        mkdir -p /etc/dconf/db/local.d
        cat << 'EOF' > /etc/dconf/db/local.d/01-input-sources
        [org/gnome/desktop/input-sources]
        sources=[('xkb', 'us')]

        [org/gnome/settings-daemon/plugins/xsettings]
        overrides={'Gtk/IMModule': <'fcitx'>}
        EOF
        dconf update

        # 4. 从 GNOME 官方扩展中心动态获取匹配当前 GNOME 版本的最新 Kimpanel 发行包
        echo "==> 正在获取 GNOME 官方最新版 Kimpanel..."
        SHELL_VER=$(gnome-shell --version | awk '{print $3}' | cut -d'.' -f1)
        DOWNLOAD_URL=$(curl -s "https://extensions.gnome.org/extension-info/?uuid=kimpanel@kde.org&shell_version=${SHELL_VER}" | grep -o '"download_url": *"[^"]*"' | cut -d'"' -f4)

        if [ -n "$DOWNLOAD_URL" ]; then
            mkdir -p /usr/share/gnome-shell/extensions/kimpanel@kde.org
            curl -sSL "https://extensions.gnome.org${DOWNLOAD_URL}" -o /tmp/kimpanel.zip
            unzip -qo /tmp/kimpanel.zip -d /usr/share/gnome-shell/extensions/kimpanel@kde.org/
            rm -f /tmp/kimpanel.zip
            glib-compile-schemas /usr/share/gnome-shell/extensions/kimpanel@kde.org/schemas/ 2>/dev/null || true
        else
            echo "==> 警告: 未能从 GNOME Extensions API 解析到 Kimpanel 下载链接"
        fi

        # 5. 系统级打包注入【雾凇拼音（Rime-ICE）】官方词库
        echo "==> 正在拉取官方最新的雾凇拼音（Rime-ICE）并打包到系统模板中..."
        mkdir -p /etc/skel/.local/share/fcitx5/rime
        git clone --depth 1 https://github.com/iDvel/rime-ice.git /tmp/rime-ice
        cp -r /tmp/rime-ice/* /etc/skel/.local/share/fcitx5/rime/
        rm -rf /tmp/rime-ice

        # 6. 预置系统新用户默认输入法配置（默认激活 Rime 雾凇）
        mkdir -p /etc/skel/.config/fcitx5
        cat << 'EOF' > /etc/skel/.config/fcitx5/profile
        [Groups/0]
        Name=Default
        Default Layout=us
        DefaultIM=rime

        [Groups/0/Items/0]
        Name=keyboard-us
        Layout=

        [Groups/0/Items/1]
        Name=rime
        Layout=

        [GroupOrder]
        0=Default
        EOF

        # 7. 预置 GTK2 与 GTK3 专属兼容配置（严格遵循极简实践：不配置 GTK4）
        cat << 'EOF' > /etc/skel/.gtkrc-2.0
        gtk-im-module="fcitx"
        EOF

        mkdir -p /etc/skel/.config/gtk-3.0
        cat << 'EOF' > /etc/skel/.config/gtk-3.0/settings.ini
        [Settings]
        gtk-im-module=fcitx
        EOF

        # 8. 全局开启 Tailscale 后台守护服务并配置桌面托盘
        systemctl enable tailscaled.service
        cat << 'EOF' > /usr/lib/systemd/user/tailscale-systray.service
        [Unit]
        Description=Tailscale System Tray
        Documentation=https://tailscale.com/kb/1597/linux-systray
        Requires=dbus.service
        After=dbus.service graphical-session.target
        PartOf=graphical-session.target

        [Service]
        Type=simple
        ExecStart=/usr/bin/tailscale systray
        Restart=on-failure
        RestartSec=5

        [Install]
        WantedBy=graphical-session.target
        EOF
        ln -sf /usr/lib/systemd/user/tailscale-systray.service /usr/lib/systemd/user/graphical-session.target.wants/tailscale-systray.service

  # 7. 全局配置 Flatpak 沙盒覆盖规则（彻底修复 LocalSend 字体豆腐块 + 全局 Flatpak 中文输入）
  - type: script
    snippets:
      - |
        echo "==> 正在全局注入 Flatpak 权限覆盖规则与字体模版..."
        mkdir -p /etc/flatpak/overrides

        # 1. 修复 LocalSend 中文字体：双重放行字体文件与字体配置
        cat << 'EOF' > /etc/flatpak/overrides/org.localsend.localsend_app
        [Context]
        filesystems=xdg-data/fonts:ro;xdg-config/fontconfig:ro;
        EOF

        # 2. 全局 Flatpak 输入法放行：放行 Fcitx5 配置，让所有 Flatpak 能正常打中文
        cat << 'EOF' > /etc/flatpak/overrides/global
        [Context]
        filesystems=xdg-config/fcitx5:ro;

        [Environment]
        XMODIFIERS=@im=fcitx
        EOF

        # 3. 在系统新用户模板中预置 DroidSansFallbackFull 中文字体
        mkdir -p /etc/skel/.local/share/fonts
        if [ -f /usr/share/fonts/google-droid-sans-fonts/DroidSansFallbackFull.ttf ]; then
            cp /usr/share/fonts/google-droid-sans-fonts/DroidSansFallbackFull.ttf /etc/skel/.local/share/fonts/
        fi

  # 8. 个人必备 Flatpak 软件（配置交大 Base URL，避免 404 summary 报错）
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          url: https://mirror.sjtu.edu.cn/flathub    # 【关键修正】必须为 Base URL，杜绝 /summary 404
          title: Flathub (SJTUG Mirror)
        install:
          - com.google.Chrome                   # 谷歌浏览器
          - org.onlyoffice.desktopeditors       # ONLYOFFICE 办公套件
          - org.localsend.localsend_app         # LocalSend 局域网传输
          - io.podman_desktop.PodmanDesktop     # Podman 容器桌面端
          - org.gnome.Boxes                     # GNOME Boxes 虚拟机

  # 9. 首次登录全自动装配（内核级 flock 内存锁 + 先 tap 后 trust + WezTerm 配置自动同步）
  - type: script
    snippets:
      - |
        echo "==> 正在系统级配置 Homebrew 全局环境与首次登录装配钩子..."

        # 1. 全局配置 Homebrew 环境变量与清华大学镜像源
        mkdir -p /etc/profile.d
        cat << 'EOF' > /etc/profile.d/00-linuxbrew.sh
        export HOMEBREW_PREFIX="/home/linuxbrew/.linuxbrew"
        export HOMEBREW_CELLAR="/home/linuxbrew/.linuxbrew/Cellar"
        export HOMEBREW_REPOSITORY="/home/linuxbrew/.linuxbrew/Homebrew"
        export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
        export HOMEBREW_API_DOMAIN="https://mirrors.tuna.tsinghua.edu.cn/homebrew-bottles/api"
        export HOMEBREW_BOTTLE_DOMAIN="https://mirrors.tuna.tsinghua.edu.cn/homebrew-bottles"
        EOF
        chmod 644 /etc/profile.d/00-linuxbrew.sh

        # 2. 将个人定制 Brewfile 写入系统共享目录（纯 CLI 工具链）
        mkdir -p /usr/share/ublue-os/my-brew
        cat << 'EOF' > /usr/share/ublue-os/my-brew/Brewfile
        tap "anomalyco/tap"
        brew "node"
        brew "pnpm"
        brew "python"
        brew "uv"
        brew "ripgrep"
        brew "jq"
        brew "zstd"
        brew "openssl"
        brew "anomalyco/tap/opencode-v2"
        brew "merve"
        EOF

        # 3. 注入 Bluefin 官方首登执行脚本
        mkdir -p /usr/share/ublue-os/user-setup.hooks.d
        cat << 'EOF' > /usr/share/ublue-os/user-setup.hooks.d/30-my-brew.sh
        #!/usr/bin/env bash

        # 确保新用户基础目录健全（符合 XDG 规范）
        mkdir -p "$HOME/.config" "$HOME/.local/share/fonts" "$HOME/.local/state"

        # 确保当前用户目录下具有 LocalSend 渲染所需的回退中文字体
        if [ ! -f "$HOME/.local/share/fonts/DroidSansFallbackFull.ttf" ] && [ -f /usr/share/fonts/google-droid-sans-fonts/DroidSansFallbackFull.ttf ]; then
            cp /usr/share/fonts/google-droid-sans-fonts/DroidSansFallbackFull.ttf "$HOME/.local/share/fonts/"
        fi

        # 确保 WezTerm 终端配置自动下发至用户主目录（优先读取 /usr/etc/skel 出厂模板）
        mkdir -p "$HOME/.config/wezterm"
        if [ ! -f "$HOME/.config/wezterm/wezterm.lua" ]; then
            if [ -f /usr/etc/skel/.config/wezterm/wezterm.lua ]; then
                cp /usr/etc/skel/.config/wezterm/wezterm.lua "$HOME/.config/wezterm/wezterm.lua"
            elif [ -f /etc/skel/.config/wezterm/wezterm.lua ]; then
                cp /etc/skel/.config/wezterm/wezterm.lua "$HOME/.config/wezterm/wezterm.lua"
            fi
        fi

        # 确保 GTK2 配置文件自动下发至用户主目录
        if [ ! -f "$HOME/.gtkrc-2.0" ]; then
            if [ -f /usr/etc/skel/.gtkrc-2.0 ]; then
                cp /usr/etc/skel/.gtkrc-2.0 "$HOME/.gtkrc-2.0"
            elif [ -f /etc/skel/.gtkrc-2.0 ]; then
                cp /etc/skel/.gtkrc-2.0 "$HOME/.gtkrc-2.0"
            fi
        fi

        # 确保系统级预置的 Kimpanel 扩展自动激活
        which gnome-extensions >/dev/null 2>&1 && gnome-extensions enable kimpanel@kde.org 2>/dev/null || true

        # 同步锁定用户级（--user）Flatpak 镜像为上海交大源（采用 Base URL）
        flatpak remote-add --user --if-not-exists flathub https://mirror.sjtu.edu.cn/flathub/flathub.flatpakrepo 2>/dev/null || true
        flatpak remote-modify --user flathub --url=https://mirror.sjtu.edu.cn/flathub 2>/dev/null || true

        # 幂等性检测：已安装完成则直接退出
        INSTALL_FLAG="$HOME/.config/user-brew-installed"
        [ -f "$INSTALL_FLAG" ] && exit 0

        BREW_BIN="/home/linuxbrew/.linuxbrew/bin/brew"

        # 异步在后台运行，并将日志输出到用户隔离目录
        (
            # 使用内存级 runtime 目录排他锁，关机或崩溃内核自动释放，绝不死锁
            LOCK_FILE="${XDG_RUNTIME_DIR:-/tmp}/simon-brew.lock"
            exec 200>"$LOCK_FILE"
            if ! flock -n 200; then
                exit 0
            fi

            # 初次启动触发 Rime 词库编译部署（确保雾凇词库立即可用）
            which fcitx5-remote >/dev/null 2>&1 && fcitx5-remote -r 2>/dev/null || true

            # 等待 Bluefin 自带解压 Homebrew 完成（最多等 120 秒）
            count=0
            while [ ! -x "${BREW_BIN}" ] && [ $count -lt 60 ]; do
                sleep 2
                count=$((count + 1))
            done

            [ ! -x "${BREW_BIN}" ] && exit 0

            # 国内网络探测（检测清华镜像连通性，避免 curl github.com 超时判死）
            net_count=0
            while ! curl -s --connect-timeout 2 https://mirrors.tuna.tsinghua.edu.cn > /dev/null && [ $net_count -lt 30 ]; do
                sleep 2
                net_count=$((net_count + 1))
            done

            # 加载环境变量与国内清华 Bottle 镜像（解决 ghcr.io 连接被重置问题）
            eval "$("${BREW_BIN}" shellenv)"
            export HOMEBREW_API_DOMAIN="https://mirrors.tuna.tsinghua.edu.cn/homebrew-bottles/api"
            export HOMEBREW_BOTTLE_DOMAIN="https://mirrors.tuna.tsinghua.edu.cn/homebrew-bottles"

            # 显式先拉取第三方 Tap，再信任授权，彻底避免 bundle 因 untrusted tap 拒绝安装
            "${BREW_BIN}" tap anomalyco/tap
            "${BREW_BIN}" trust anomalyco/tap

            # 执行安装并通知桌面
            if "${BREW_BIN}" bundle --file="/usr/share/ublue-os/my-brew/Brewfile"; then
                touch "$INSTALL_FLAG"
                which notify-send >/dev/null 2>&1 && notify-send "系统初始化通知" "个人 Homebrew 开发工具已全自动安装完成！" -i package-x-generic
            fi
        ) >"$HOME/.local/state/brew-setup.log" 2>&1 &
        EOF

        chmod +x /usr/share/ublue-os/user-setup.hooks.d/30-my-brew.sh

  # 10. 规范化 OSTree 目录树（将 /etc 变更合并同步至 /usr/etc，并清理顶层 /etc，杜绝 Tree contains both 错误）
  - type: script
    snippets:
      - |
        echo "==> 正在规范化 OSTree 目录树（消除 /etc 与 /usr/etc 冲突）..."
        if [ -d /usr/etc ]; then
            echo "==> 检测到 /usr/etc，正在合并 /etc 出厂配置并清理冲突..."
            cp -rT /etc /usr/etc 2>/dev/null || cp -rn /etc/* /usr/etc/ 2>/dev/null || true
            find /etc -mindepth 1 ! -name "hosts" ! -name "resolv.conf" ! -name "hostname" -delete 2>/dev/null || true
        fi

  # 11. 容器镜像加密数字签名（必选）
  - type: signing
